server:
  port: 9010

spring:
  application:
    name: "message"
  cloud:
    function:
      definition: email|sms
    stream:
      bindings:
        # input binding, 0 is the starting index value
        emailsms-in-0:
          # RabbitMQ exchange to consume from (queue is derived from destination.group)
          # `destination` = exchange, `destination.group` = queue
          destination: send-communication
          group: ${spring.application.name}
        emailsms-out-0:
          destination: communication-sent
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s